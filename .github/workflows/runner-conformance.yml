name: runner-conformance
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - "**.md"
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  runner-light:
    name: Runner light conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          lfs: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Build local runner and server
        run: cargo build --locked -p preloop-runner-server -p preloop-runner -p preloop-runner-client
      - name: Run current runner against local Preloop
        run: |
          rm -f benchmarks/compatibility/runner/behavior/conformance-preloop.jsonl
          # Container and service scenarios require the VM-backed executor;
          # runner-light intentionally validates only host-executable fixtures.
          python3 benchmarks/real-world/local-runner-conformance.py \
            --server-binary target/debug/preloop-server \
            --runner-binary target/debug/preloop-runner \
            --client-binary target/debug/preloop-runner-client \
            --official benchmarks/compatibility/runner/behavior/conformance-official.jsonl \
            --exclude-prefix 2 \
            --exclude-prefix 16-container \
            --exclude-prefix 17 \
            --exclude-prefix 30 \
            --exclude-prefix 31 \
            --exclude-prefix 32 \
            --exclude-prefix 33 \
            --exclude-prefix 34 \
            --exclude-prefix 35 \
            --exclude-prefix 36 \
            --output benchmarks/compatibility/runner/behavior/conformance-preloop.jsonl
      - name: Validate local runner outcomes
        run: |
          python3 benchmarks/real-world/runner-conformance.py \
            --mode local \
            --preloop benchmarks/compatibility/runner/behavior/conformance-preloop.jsonl \
            --output benchmarks/compatibility/runner/behavior/RUNNER-CONFORMANCE-REPORT.md
      - name: Upload light report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runner-light-conformance
          path: |
            benchmarks/compatibility/runner/behavior/RUNNER-CONFORMANCE-REPORT.md
            benchmarks/compatibility/runner/behavior/conformance-preloop.jsonl
          if-no-files-found: error

  runner-deep:
    name: Runner deep conformance on GitHub-hosted KVM
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && vars.PRELOOP_CONFORMANCE_DEEP == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_REPO: ${{ vars.RUNNER_CONFORMANCE_REPO || 'preloopdev/preloop-conformance' }}
      GH_TOKEN: ${{ secrets.RUNNER_CONFORMANCE_TOKEN }}
      PRELOOP_RUNNER_HOST: ${{ github.workspace }}/target/x86_64-unknown-linux-musl/release/preloop-runner
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          # Same as the light job: the deep batch replays live runners, not the
          # committed golden captures.
          lfs: false
      - name: Build current PR runner for smolVM
        run: cargo zigbuild -p preloop-runner --release --target x86_64-unknown-linux-musl
      - name: Run deep runner conformance
        run: |
          rm -f benchmarks/compatibility/runner/behavior/conformance-{preloop,official}.jsonl
          bash ./benchmarks/real-world/batch-conformance.sh both '10[1-9]-*' '11[0-5]-*'
          python3 benchmarks/real-world/runner-conformance.py --mode deep
      - name: Upload deep report and captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runner-deep-conformance
          path: |
            benchmarks/compatibility/runner/behavior/RUNNER-CONFORMANCE-REPORT.md
            benchmarks/compatibility/runner/behavior/conformance-*.jsonl
            benchmarks/compatibility/runner/behavior/vm-*.log
          if-no-files-found: error
